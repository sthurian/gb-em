<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gb-em</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #1a1a1a;
        color: #e0f8d0;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
      }
      canvas {
        width: 480px;
        height: 432px;
        image-rendering: pixelated;
        border: 2px solid #34685688;
        background: #08181488;
      }
      #controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #88c070;
      }
      label {
        cursor: pointer;
        border: 1px solid #34685688;
        padding: 6px 14px;
        border-radius: 4px;
        transition: border-color 0.15s;
      }
      label:hover { border-color: #88c070; }
      #rom-input { display: none; }
      #hint {
        font-size: 11px;
        color: #34685680;
        text-align: center;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="160" height="144"></canvas>
    <div id="controls">
      <label for="rom-input">Load ROM (.gb)</label>
      <input type="file" id="rom-input" accept=".gb" />
    </div>
    <div id="hint">
      Arrow keys · Z = A · X = B · Enter = Start · Backspace = Select
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
